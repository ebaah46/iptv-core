[workspace]
resolver = "2"
members = [
    "core",
    "adapters/*"
]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
log = "0.4.33"
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
redb = "4.1.0"
postcard = { version = "1.1.3", features = ["alloc"] }