[workspace]
resolver = "2"
members = [
    "core",
    "adapters/*"
]

[workspace.package]
version = "0.2.7"
edition = "2024"
authors = ["BEKs <ebaah72@gmail.com>"]
license = "GPL-3"
repository = "https://github.com/ebaah46/iptv-core"


[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
log = "0.4.33"
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
redb = "4.1.0"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }


# internal workspace crates
adapter-api = { path = "adapters/iptv-adapter-api" }
adapter-cache = { path = "adapters/iptv-adapter-cache" }
core = { path = "core" }

[profile.release]
debug = false             # Keeps debug symbols (maps hex addresses to function names)
split-debuginfo = "packed" # Ensures symbols are generated into a format the profiler can grab
strip = "none"           # Guarantees symbols aren't stripped later

[profile.dev]
debug = true             # Keeps debug symbols (maps hex addresses to function names)
split-debuginfo = "packed" # Ensures symbols are generated into a format the profiler can grab
strip = "none"           # Guarantees symbols aren't stripped later
